# observability/traefik/traefik-dynamic.yml
http:
  routers:
    # existing proxied routers (keep)
    tfx-dash-root:
      entryPoints: [ "web" ]
      rule: Path(`/traefik`) || Path(`/traefik/`)
      middlewares: [ "tfx-dash-redirect-root" ]
      service: dashboard@internal
      priority: 20000

    tfx-dash:
      entryPoints: [ "web" ]
      rule: PathPrefix(`/traefik/dashboard`)
      middlewares: [ "tfx-dash-pathfix","dashboard_stripprefix@internal" ]
      service: dashboard@internal
      priority: 15000

    tfx-api:
      entryPoints: [ "web" ]
      rule: PathPrefix(`/traefik/api`)
      middlewares: [ "tfx-api-rp" ]
      service: api@internal
      priority: 10100

    # NEW: handle the dashboard’s absolute requests
    tfx-dash-abs:
      entryPoints: [ "web" ]
      rule: PathPrefix(`/dashboard`)
      middlewares: [ "dashboard_stripprefix@internal" ]
      service: dashboard@internal
      priority: 12000

    tfx-api-abs:
      entryPoints: [ "web" ]
      rule: PathPrefix(`/api`)
      service: api@internal
      priority: 12000

  middlewares:
    tfx-dash-redirect-root:
      redirectRegex:
        regex: "^/traefik/?$"
        replacement: "/traefik/dashboard/"
        permanent: true

    tfx-dash-pathfix:
      replacePathRegex:
        regex: "^/traefik/dashboard/?(.*)$"
        replacement: "/dashboard/$1"

    tfx-api-rp:
      replacePathRegex:
        regex: "^/traefik/api/?(.*)$"
        replacement: "/api/$1"
