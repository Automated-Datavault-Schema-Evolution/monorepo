services:
  postgres:
    image: postgres:17.5
    container_name: postgresdb
    environment:
      # POSTGRES_USER: ${POSTGRES_USER}
      # POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --auth-local=md5"
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ${HOST_PG_DATA}:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data-automation-net

networks:
  data-automation-net:
    external: true

volumes:
  pgdata:
