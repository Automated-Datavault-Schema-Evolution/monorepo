services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports: [ "80:80" ]
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock:ro" ]
    networks: [ data-automation-net ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=PathPrefix(`/traefik`)
      - traefik.http.routers.traefik.service=api@internal
      - traefik.http.middlewares.strip-traefik.stripprefix.prefixes=/traefik
      - traefik.http.routers.traefik.middlewares=strip-traefik

  dockge:
    image: louislam/dockge:1
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services:/opt/stacks/services          # your submodules (data_vault, datalake_handler, etc.)
      - ./DOCKER_FILES:/opt/stacks/DOCKER_FILES  # postgres, kafka live here
    networks: [ data-automation-net ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockge.rule=PathPrefix(`/dockge`)
      - traefik.http.services.dockge.loadbalancer.server.port=5001
      - traefik.http.middlewares.strip-dockge.stripprefix.prefixes=/dockge
      - traefik.http.routers.dockge.middlewares=strip-dockge

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-provisioning:/etc/grafana/provisioning
    networks: [ data-automation-net ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.middlewares.strip-grafana.stripprefix.prefixes=/grafana
      - traefik.http.routers.grafana.middlewares=strip-grafana

  prometheus:
    image: prom/prometheus:v2.55.0
    command: [ "--config.file=/etc/prometheus/prometheus.yml" ]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [ data-automation-net ]

  loki:
    image: grafana/loki:2.9.6
    command: [ "-config.file=/etc/loki/config.yaml" ]
    volumes:
      - loki-data:/loki
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro


  promtail:
    image: grafana/promtail:2.9.6
    command: [ "-config.file=/etc/promtail/config.yml" ]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    networks: [ data-automation-net ]
    depends_on: [ loki ]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    volumes: [ uptime-kuma-data:/app/data ]
    networks: [ data-automation-net ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=PathPrefix(`/status`)
      - traefik.http.services.kuma.loadbalancer.server.port=3001
      - traefik.http.middlewares.strip-kuma.stripprefix.prefixes=/status
      - traefik.http.routers.kuma.middlewares=strip-kuma

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [ data-automation-net ]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: [ "--path.rootfs=/host" ]
    volumes:
      - "/:/host:ro"           # drop ,rslave
    networks: [ data-automation-net ]

  marquez-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=marquez
      - POSTGRES_PASSWORD=marquez
      - POSTGRES_DB=marquez

  marquez:
    image: marquezproject/marquez:0.50.0
    environment:
      - MARQUEZ_DB_HOST=marquez-db
      - MARQUEZ_DB_PORT=5432
      - MARQUEZ_DB_USER=marquez
      - MARQUEZ_DB_PASSWORD=marquez
      - MARQUEZ_DB_NAME=marquez


volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  uptime-kuma-data:
  marquez-db:

networks:
  data-automation-net:
    external: true
