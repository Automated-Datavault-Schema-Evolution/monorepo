services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --entrypoints.web.address=:80
      - --entrypoints.traefik.address=:8080
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/traefik-dynamic.yml
      - --log.level=DEBUG
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/traefik/traefik-dynamic.yml:/etc/traefik/traefik-dynamic.yml:ro
    labels:
      traefik.enable: "true"
    networks:
      - data-automation-net



  dockge:
    image: louislam/dockge:1
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./services:/opt/stacks/services          # your submodules (data_vault, datalake_handler, etc.)
      - ./DOCKER_FILES:/opt/stacks/DOCKER_FILES  # postgres, kafka live here
    networks: [ data-automation-net ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dockge.rule=PathPrefix(`/dockge`)
      - traefik.http.services.dockge.loadbalancer.server.port=5001
      - traefik.http.middlewares.strip-dockge.stripprefix.prefixes=/dockge
      - traefik.http.routers.dockge.middlewares=strip-dockge

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME=postgres
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=postgres
      - GF_SERVER_ROOT_URL=http://localhost/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning
    networks: [ data-automation-net ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.middlewares.strip-grafana.stripprefix.prefixes=/grafana
      - traefik.http.routers.grafana.middlewares=strip-grafana

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=/prometheus
      - --web.route-prefix=/
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [ data-automation-net ]
    labels:
      - traefik.enable=true
      - traefik.http.routers.prom.rule=Path(`/prometheus`) || PathPrefix(`/prometheus/`)
      - traefik.http.routers.prom.entrypoints=web
      - traefik.http.services.prom.loadbalancer.server.port=9090
      - traefik.http.middlewares.strip-prom.stripprefix.prefixes=/prometheus
      - traefik.http.routers.prom.middlewares=strip-prom

  loki:
    image: grafana/loki:2.9.6
    command: [ "-config.file=/etc/loki/config.yaml" ]
    volumes:
      - loki-data:/loki
      - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
    networks: [ data-automation-net ]

  promtail:
    image: grafana/promtail:2.9.6
    command: [ "-config.file=/etc/promtail/config.yml" ]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
    networks: [ data-automation-net ]
    depends_on: [ loki ]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    labels:
      - traefik.enable=true
      # Match /status and anything under it
      - traefik.http.routers.kuma.rule=Path(`/status`) || PathPrefix(`/status/`)
      - traefik.http.routers.kuma.entrypoints=web
      - traefik.http.services.kuma.loadbalancer.server.port=3001
      # Strip /status before forwarding to Kuma
      - traefik.http.middlewares.strip-kuma.stripprefix.prefixes=/status
      - traefik.http.routers.kuma.middlewares=strip-kuma

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [ data-automation-net ]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: [ "--path.rootfs=/host" ]
    volumes:
      - "/:/host:ro"           # drop ,rslave
    networks: [ data-automation-net ]

  marquez-db-init:
    image: postgres:15
    volumes:
      - ./observability/marquez-db-init.sh:/init.sh:ro
    environment:
      # Optional overrides; if not set, script defaults kick in.
      PGHOST: postgresdb
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      MARQUEZ_DB: marquez
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez
      MARQUEZ_DB_RESET: "false"
    entrypoint: [ "sh", "/init.sh" ]
    networks: [ data-automation-net ]
    restart: "no"

  marquez:
    image: marquezproject/marquez:0.50.0
    command: [ "server", "/etc/marquez/config.yml" ]
    environment:
      MARQUEZ_CONFIG: /etc/marquez/config.yml
      MARQUEZ_MIGRATE_ON_STARTUP: "false"
    volumes:
      - ./observability/marquez-config.yml:/etc/marquez/config.yml:ro
    depends_on:
      - marquez-db-init
    networks: [ data-automation-net ]
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.marquez.entrypoints=web
      - traefik.http.routers.marquez.rule=PathPrefix(`/lineage`)
      - traefik.http.services.marquez.loadbalancer.server.port=5000
      - traefik.http.middlewares.lineage-strip.stripprefix.prefixes=/lineage
      - traefik.http.routers.marquez.middlewares=lineage-strip





volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  uptime-kuma-data:
  marquez-db:

networks:
  data-automation-net:
    external: true
